<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人生日历</title>
  <link rel="stylesheet" href="newtab.css">
  <link rel="stylesheet" href="settings-panel.css">
  <style id="theme-style"></style>
</head>
<body>
  <main class="page" id="page" hidden>
    <header class="page-header">
      <div class="title-block">
        <h1 class="title" id="title">人生日历</h1>
        <p class="stats" id="stats"></p>
        <p class="quote" id="quote" hidden>
          <span id="quote-text"></span><span class="quote-author" id="quote-author"></span>
        </p>
        <p class="history" id="history" hidden></p>
      </div>
      <button class="settings-btn" id="settings-btn" title="设置" aria-label="设置">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </header>
    <div class="life-progress" id="life-progress" role="img" aria-label="生命进度条"></div>
    <section class="card">
      <div class="grid" id="grid"></div>
    </section>
  </main>

  <div class="onboarding" id="onboarding" hidden>
    <form class="ob-card" id="ob-form">
      <h1 class="ob-title" id="ob-title">人生日历</h1>
      <p class="ob-desc" id="ob-desc"></p>
      <label class="ob-label" id="ob-label" for="ob-birthdate">你的出生日期</label>
      <input class="ob-input" type="date" id="ob-birthdate" required>
      <button class="ob-submit" type="submit" id="ob-submit">开始</button>
    </form>
  </div>

  <div class="settings-overlay" id="settings-overlay" hidden>
    <div class="settings-modal" role="dialog" aria-modal="true" aria-label="设置">
      <div id="settings-root"></div>
    </div>
  </div>

  <script type="module" src="newtab.js"></script>
</body>
</html>
