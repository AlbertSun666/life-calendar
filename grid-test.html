<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>grid-test</title>
  <style>
    body { margin: 0; background: #ddd; padding: 16px; font-family: sans-serif; }
    .row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
    canvas { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.2); }
    .note { margin: 0 0 10px; color: #444; font-size: 12px; }
  </style>
</head>
<body>
  <p class="note" id="note">loading…</p>
  <div class="row"><canvas id="cv"></canvas></div>
  <script type="module">
    import { getSettings } from './src/lib/storage.js';
    import { renderGridPNG } from './src/lib/grid-to-png.js';

    const note = document.getElementById('note');
    try {
      const settings = await getSettings();
      const p = new URLSearchParams(location.search);
      const today = p.get('today')
        ? (() => { const [y, m, d] = p.get('today').split('-').map(Number); return { year: y, month: m, day: d }; })()
        : (() => { const n = new Date(); return { year: n.getFullYear(), month: n.getMonth() + 1, day: n.getDate() }; })();
      const blob = await renderGridPNG(settings, today);
      const url = URL.createObjectURL(blob);
      const img = new Image();
      img.onload = () => {
        const cv = document.getElementById('cv');
        cv.width = img.width;
        cv.height = img.height;
        cv.getContext('2d').drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        note.textContent = `OK ${img.width}×${img.height} · theme=${settings.theme} · glyph=${settings.customThemes ? 'custom' : ''}`;
      };
      img.src = url;
    } catch (err) {
      note.textContent = 'FAIL: ' + err.message;
      console.error(err);
    }
  </script>
</body>
</html>
